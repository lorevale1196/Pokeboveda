<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokebóveda - Panel Admin</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">
        <img src="img/pokeball.png" alt="Pokeball" class="pokeball">
        <h1>Panel de Administración</h1>
        <p>✨ Gestión de Pokebóveda ✨</p>
    </div>
</header>

<main class="contenedor-admin">

    <div id="seccionLogin" class="seccion-solicitud">
        <h2>🔒 Iniciar Sesión</h2>
        <form id="formLogin" class="form-cute">
            <div class="grupo-input">
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" placeholder="admin" required>
            </div>
            <div class="grupo-input">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-enviar">Entrar 🔑</button>
            <p id="errorLogin" style="color: red; display: none; font-weight: bold; margin-top: 10px;"></p>
        </form>
    </div>

    <div id="seccionPanel" style="display: none;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin: 20px;">
            <h2>✨ Solicitudes Recibidas ✨</h2>
            <button id="btnCerrarSesion" style="background: #ff6f91;">Cerrar Sesión 🚪</button>
        </div>

        <div id="listaSolicitudes" class="contenedor-solicitudes">
            </div>

    </div>

</main>

<footer>
    💗 Pokebóveda 2026 - Área Privada 💗
</footer>

<script src="admin.js"></script>

</body>

</html>
